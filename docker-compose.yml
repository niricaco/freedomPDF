version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: freedompdf:latest
    container_name: freedompdf_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_SECRET=supersecret
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - ./uploads:/app/uploads
